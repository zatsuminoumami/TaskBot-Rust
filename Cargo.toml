[package]
name = "taskbot"
version = "0.1.0"
edition = "2024"

[dependencies]
serenity = { version = "0.11.7", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "builder"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
